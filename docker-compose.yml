version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./stockflow/migrations:/docker-entrypoint-initdb.d:ro
      - stockflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockflow_pgdata:
    name: stockflow_postgres_data
